<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b1b">
  <title>VENTOUR | Flight Experience</title>
  <style>
    :root{color-scheme:dark;--pink:#f000d8;--cyan:#31d8d0;--muted:#b9c3d6}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;font-family:Arial,sans-serif;color:#fff;background:#080b1b}
    .scene{position:relative;isolation:isolate;min-height:100vh;overflow:hidden;background:radial-gradient(ellipse at 70% 34%,#294b85 0,#17254a 24%,#10152f 52%,#080b1b 82%)}
    .scene:before,.scene:after{content:"";position:absolute;inset:-30%;z-index:-1;pointer-events:none}
    .scene:before{opacity:.55;background-image:radial-gradient(2px 2px at 15% 28%,#fff 98%,transparent),radial-gradient(1px 1px at 62% 18%,#fff 98%,transparent),radial-gradient(2px 2px at 79% 64%,#a7f8ff 98%,transparent),radial-gradient(1px 1px at 32% 75%,#fff 98%,transparent),radial-gradient(1px 1px at 88% 31%,#fff 98%,transparent);background-size:380px 260px;animation:star-drift 50s linear infinite}
    .scene:after{inset:auto -10% -30%;height:65%;background:radial-gradient(ellipse at 50% 100%,rgba(49,216,208,.23),transparent 62%);filter:blur(20px)}
    header{position:absolute;z-index:5;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:24px clamp(20px,7vw,100px)}
    .brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;font-weight:800;letter-spacing:.08em;perspective:700px}
    .brand-logo{position:relative;display:grid;place-items:center;width:58px;height:44px;overflow:hidden;border:1px solid #ffffff50;border-radius:10px;background:#050609;box-shadow:0 10px 24px #0008,0 0 18px #31d8d044;transform-style:preserve-3d;animation:logo-float 5s ease-in-out infinite;transition:box-shadow .3s,filter .3s}
    .brand-logo:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(125deg,#ffffff45,transparent 36%,transparent 68%,#31d8d033)}
    .brand-logo img{display:block;width:100%;height:100%;object-fit:cover;transform:translateZ(5px)}
    .brand:hover .brand-logo{animation-play-state:paused;transform:rotateY(-22deg) rotateX(10deg) translateY(-3px);box-shadow:0 14px 28px #0009,0 0 26px #31d8d077;filter:brightness(1.15)}
    .brand-name span{color:var(--pink)}
    header>a{color:#fff;text-decoration:none;border:1px solid #ffffff38;border-radius:999px;padding:11px 18px;font-size:13px;transition:background .2s,border-color .2s}
    header>a:hover{background:#ffffff16;border-color:var(--cyan)}
    main{position:relative;z-index:2;display:grid;place-items:center;min-height:100vh;padding:100px 22px 70px;text-align:center}
    .copy{position:relative;z-index:3;max-width:760px;margin-top:-30px}
    .eyebrow{display:inline-flex;align-items:center;gap:9px;color:#c9faff;text-transform:uppercase;letter-spacing:.2em;font-size:11px;font-weight:700}
    .pulse{width:7px;height:7px;background:var(--cyan);border-radius:50%;box-shadow:0 0 15px var(--cyan)}
    h1{font-size:clamp(42px,8vw,88px);line-height:.95;letter-spacing:-.06em;margin:19px 0 16px;text-shadow:0 6px 40px #0008}
    h1 span{display:block;color:var(--pink);text-shadow:0 0 35px #f000d866}
    .copy p{max-width:510px;margin:0 auto;color:#d4dbea;font-size:16px;line-height:1.7}
    .flight-stage{position:absolute;inset:0;overflow:hidden;perspective:900px;pointer-events:none}
    .route{position:absolute;width:min(78vw,900px);height:300px;top:42%;left:50%;transform:translate(-50%,-50%) rotateX(58deg) rotateZ(-9deg);border:2px dashed #7fefff66;border-color:#7fefff66 transparent transparent;border-radius:50%;filter:drop-shadow(0 0 8px #31d8d077);animation:route-glow 3s ease-in-out infinite alternate}
    .route:before,.route:after{content:"";position:absolute;width:12px;height:12px;border-radius:50%;background:var(--cyan);box-shadow:0 0 18px 5px #31d8d088;top:-7px}
    .route:before{left:10%}.route:after{right:10%;background:var(--pink);box-shadow:0 0 18px 5px #f000d888}
    .plane{position:absolute;z-index:2;left:50%;top:42%;font-size:clamp(60px,10vw,112px);line-height:1;filter:drop-shadow(0 15px 20px #0008) drop-shadow(0 0 18px #bafaff55);transform-style:preserve-3d;animation:flight 9s cubic-bezier(.45,.05,.55,.95) infinite}
    .plane:after{content:"";position:absolute;width:95px;height:22px;border-radius:50%;background:#c9faff55;filter:blur(16px);left:-10px;bottom:-13px;transform:rotateX(70deg);z-index:-1}
    .cloud{position:absolute;width:220px;height:58px;border-radius:50px;background:linear-gradient(180deg,#fff,#b9d1ed 95%);opacity:.2;filter:blur(2px);box-shadow:0 10px 24px #a5c6ff22;animation:cloud-drift 26s linear infinite}
    .cloud:before,.cloud:after{content:"";position:absolute;bottom:15px;border-radius:50%;background:inherit}
    .cloud:before{width:90px;height:90px;left:32px}.cloud:after{width:120px;height:120px;right:24px;bottom:8px}
    .cloud-one{left:-260px;top:32%;transform:scale(.7);animation-duration:32s}.cloud-two{left:-300px;top:69%;transform:scale(1.1);animation-delay:-13s;animation-duration:39s}.cloud-three{left:-220px;top:19%;transform:scale(.45);animation-delay:-21s;animation-duration:28s}.cloud-four{left:-280px;top:80%;transform:scale(.6);animation-delay:-7s;animation-duration:35s}
    .horizon{position:absolute;left:-15%;right:-15%;bottom:-34%;height:60%;border-radius:50%;background:linear-gradient(180deg,#233d70 0%,#111a3b 52%,#090d21 100%);box-shadow:0 -25px 100px #7fcbff24;transform:rotateX(8deg)}
    .horizon:before{content:"";position:absolute;inset:10% 0 auto;height:1px;background:linear-gradient(90deg,transparent,#a6f7ff99,transparent);box-shadow:0 0 25px 4px #31d8d033}
    .caption{position:absolute;z-index:4;bottom:34px;left:0;right:0;color:#aab8cf;font-size:11px;letter-spacing:.18em;text-transform:uppercase}
    .caption b{color:#fff;font-weight:600}
    @keyframes flight{0%,100%{transform:translate3d(-50%,-10px,60px) rotateZ(-8deg) rotateY(-16deg) rotateX(8deg)}25%{transform:translate3d(20px,-50px,100px) rotateZ(5deg) rotateY(10deg) rotateX(2deg)}50%{transform:translate3d(80px,10px,35px) rotateZ(10deg) rotateY(18deg) rotateX(-8deg)}75%{transform:translate3d(-20px,42px,80px) rotateZ(-4deg) rotateY(-7deg) rotateX(4deg)}}
    @keyframes cloud-drift{from{translate:0 0}to{translate:calc(100vw + 600px) 0}}
    @keyframes star-drift{from{transform:translateY(0)}to{transform:translateY(100px)}}
    @keyframes route-glow{from{opacity:.45}to{opacity:1}}
    @keyframes logo-float{0%,100%{transform:rotateY(-12deg) rotateX(5deg) translateY(0)}50%{transform:rotateY(12deg) rotateX(-5deg) translateY(-4px)}}
    @media(max-width:600px){header{padding:18px}.brand{gap:8px;font-size:13px}.brand-logo{width:46px;height:35px}.route{width:110vw;top:40%;height:220px}.plane{top:40%}.cloud-two{top:73%}.copy{margin-top:-10px}.copy p{font-size:14px}.caption{font-size:9px;letter-spacing:.12em}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <div class="scene">
    <header><a class="brand" href="index.html" aria-label="VENTOUR.IN home"><span class="brand-logo"><img src="logo.svg.svg" alt="VENTOUR logo"></span><span class="brand-name">VENTOUR<span>.IN</span></span></a><a href="index.html">← Back to home</a></header>
    <div class="flight-stage" aria-hidden="true">
      <div class="route"></div>
      <div class="cloud cloud-one"></div><div class="cloud cloud-two"></div><div class="cloud cloud-three"></div><div class="cloud cloud-four"></div>
      <div class="plane">✈️</div>
      <div class="horizon"></div>
    </div>
    <main>
      <div class="copy">
        <div class="eyebrow"><span class="pulse"></span> Your journey begins here</div>
        <h1>READY FOR <span>TAKEOFF?</span></h1>
        <p>Float above the clouds and discover where your next adventure could take you. VENTOUR is here to help plan every mile.</p>
      </div>
    </main>
    <div class="caption"><b>VENTOUR flight experience</b> &nbsp;·&nbsp; Explore the world, one journey at a time</div>
  </div>
</body>
</html>
