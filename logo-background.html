<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VENTOUR | Tours & Travels</title>
  <style>
    * { box-sizing: border-box; }
    html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
    body { overflow: hidden; }
    iframe { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
  <iframe id="site" src="/index.html" title="VENTOUR Tours and Travels"></iframe>
  <script>
    const site = document.getElementById('site');

    function addHeroLogoBackground() {
      try {
        const doc = site.contentDocument;
        if (!doc || !doc.head) return;

        const style = doc.createElement('style');
        style.textContent = `
          #home { isolation: isolate; }
          #home::before { z-index: 0; }
          #home::after {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background: url("/logo.svg.svg") no-repeat right center / min(78vw, 920px) auto;
            opacity: .48;
            mix-blend-mode: screen;
          }
          #home .hero-inner { position: relative; z-index: 2; }
          @media (max-width: 700px) {
            #home::after {
              background-position: center 70%;
              background-size: min(110vw, 600px) auto;
              opacity: .3;
            }
          }
        `;
        doc.head.appendChild(style);
      } catch (error) {
        console.error('Could not apply the hero logo background.', error);
      }
    }

    site.addEventListener('load', addHeroLogoBackground);
  </script>
</body>
</html>
