<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-labelledby="title desc">
  <title id="title">VENTOUR travel logo</title>
  <desc id="desc">A modern VENTOUR globe and airplane emblem in pink and blue.</desc>
  <defs>
    <linearGradient id="orbit" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#f9a8d4"/>
      <stop offset="100%" stop-color="#f000d8"/>
    </linearGradient>
    <linearGradient id="plane" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f9d4ff"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f000d8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g transform="translate(12 12)" filter="url(#softGlow)">
    <circle cx="78" cy="78" r="62" fill="none" stroke="url(#orbit)" stroke-width="8"/>
    <path d="M16 78h124M78 16v124M36 40c18 14 29 34 29 38s-11 24-29 38m84-76c-18 14-29 34-29 38s11 24 29 38" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
    <circle cx="78" cy="78" r="18" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.8"/>

    <g transform="translate(64 40) rotate(16 54 40)">
      <path d="M94 72L8 66L-8 55L17 50L62 7L82 10L70 45L110 40L128 48L110 54L90 72Z" fill="url(#plane)"/>
      <path d="M74 10L92 39L61 46L41 27Z" fill="#f000d8" opacity="0.9"/>
    </g>

    <path d="M58 42c16-16 38-26 64-28" fill="none" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <g transform="translate(180 60)">
    <text x="0" y="34" fill="#ffffff" font-size="34" font-weight="800" font-family="Arial, Helvetica, sans-serif" letter-spacing="3">VENTOUR</text>
    <text x="2" y="66" fill="#f000d8" font-size="18" font-weight="700" font-family="Arial, Helvetica, sans-serif" letter-spacing="5">.IN</text>
  </g>
</svg>
